exclude: |
  (?x)^(
    \.git/|
    __pycache__/|
    dist/|
    build/|
    uv\.lock$
  )

repos:
  # ----------------------------------------------------------------
  # Security (required by dev-charter)
  # ----------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--config=.gitleaks.toml"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Security (required)
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"]
      # General quality
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-docstring-first
      - id: debug-statements
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: sort-simple-yaml

  # Block .env files (required by dev-charter)
  - repo: local
    hooks:
      - id: detect-dotenv
        name: Block .env files
        language: fail
        entry: '.env ファイルはコミット禁止。ダミー値のみの .env.example を使うこと。'
        files: '(^|/)\.env(\.[^.]+)?$'
        exclude: '(^|/)\.env\.(example|sample|template)$'

  # Block hardcoded local paths (required by dev-charter)
  - repo: local
    hooks:
      - id: no-hardcoded-local-paths
        name: Block hardcoded local absolute paths
        language: pygrep
        entry: '(/Users/[A-Za-z0-9_.-]+/|/home/[A-Za-z0-9_.-]+/|C:\\Users\\)'
        types_or: [text]
        exclude: |
          (?x)(
            \.md$|
            docs/|
            \.github/|
            \.gitleaks\.toml$|
            \.pre-commit-config\.yaml$
          )

  # ----------------------------------------------------------------
  # Charter CI template check
  # (blocks if .github/workflows/dev-charter-check.yml drifted from the
  # template documented in the installed dev-charter's README-jp.md)
  # ----------------------------------------------------------------
  - repo: local
    hooks:
      - id: check-charter-ci-template
        name: Check charter CI template
        language: script
        entry: scripts/check-charter-ci-template.sh
        pass_filenames: false
        always_run: true

  # ----------------------------------------------------------------
  # Markdown section headings
  # ----------------------------------------------------------------
  - repo: local
    hooks:
      - id: check-markdown-heading-language
        name: Check Markdown section heading language
        language: script
        entry: scripts/check-markdown-heading-language.sh
        files: '\.md$'

  # ----------------------------------------------------------------
  # Python
  # ----------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-use-type-annotations

  # ----------------------------------------------------------------
  # Shell scripts
  # ----------------------------------------------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]

  # ----------------------------------------------------------------
  # PowerShell scripts
  # (PSScriptAnalyzer, installed locally on first run. Skipped in CI —
  # see ci.yml's SKIP env — it isn't required to gate merges; it exists
  # for local parity with the Linux/macOS shellcheck coverage above,
  # for scripts/*.ps1 counterparts of the bash scripts.)
  # ----------------------------------------------------------------
  - repo: local
    hooks:
      - id: powershell-lint
        name: PowerShell script lint (PSScriptAnalyzer)
        language: system
        entry: >-
          bash -c '
          if ! command -v pwsh >/dev/null 2>&1; then
          echo "warning: pwsh not found; skipping PowerShell lint" >&2;
          exit 0;
          fi;
          pwsh -NoProfile -NonInteractive -File scripts/check-powershell-lint.ps1 "$@"
          ' --
        files: '\.ps1$'
        require_serial: true

  # ----------------------------------------------------------------
  # Local dev-charter version check
  # (blocks if sibling ../dev-charter is newer, warns if older)
  # ----------------------------------------------------------------
  - repo: local
    hooks:
      - id: check-local-charter-version
        name: Check local dev-charter version
        language: script
        entry: scripts/check-local-charter-version.sh
        pass_filenames: false
        always_run: true
