[project]
name = "astropy_extension"
version = "0.1.0"
description = ""
authors = [
    {name = "Yukihiro Marui"},
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23.3",
    "astropy>=5.1",
    "matplotlib>=3.6.1",
    "pylightxl>=1.61",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=6.16.0",
    "pytest>=9.0.3",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
]

[tool.ruff]
target-version = "py311"
line-length = 130
# docs/dev-charter/ is a git subtree we cannot edit directly (see
# AI_CONTEXT.md); recent ruff formats fenced Python blocks in Markdown
# by default, which would otherwise flag it.
extend-exclude = ["docs/dev-charter"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
